[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # long f-strings / log lines are fine; line length is not enforced

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "retrain", "dashboard", "scripts"]
